[package]
name = "md-processor"
version = "0.1.0"
edition = "2021"

[dependencies]
md-domain = { path = "../md-domain" }
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
dashmap = "6"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"

[dev-dependencies]
# 仅 examples/retention_sizing.rs 使用（从真实抓取的 JSON 构造事件样本）
serde_json = "1"
