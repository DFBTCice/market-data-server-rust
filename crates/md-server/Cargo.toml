[package]
name = "md-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "md-server"
path = "src/main.rs"

[features]
# jemalloc 作为全局分配器 + /metrics 暴露 md_jemalloc_*（见 src/alloc_stats.rs）。
# 默认关闭（默认构建仍是 musl 自带分配器，行为与 1.1.0 相同）。
# 1.1.1 调查结论：musl 自带分配器在「订阅者短暂停读 / 抖动」后 RSS 只升不降（高水位），
# 同样的代码用 jemalloc 则平稳（evidence/1.1.1/INVESTIGATION_REPORT.md §D1/§D3）。
# 是否用于现网镜像由换版计划决定（evidence/1.1.1/nas-198/SWAP_PLAN_1.1.1.md）。
jemalloc-stats = ["dep:tikv-jemallocator", "dep:tikv-jemalloc-ctl"]

[dependencies]
md-domain = { path = "../md-domain" }
md-config = { path = "../md-config" }
md-connector = { path = "../md-connector" }
md-proto = { path = "../md-proto" }
md-processor = { path = "../md-processor" }
md-grpc = { path = "../md-grpc" }
md-gateway = { path = "../md-gateway" }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
tonic = "0.12"
axum = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1"
tikv-jemallocator = { version = "0.6", optional = true, features = ["stats"] }
tikv-jemalloc-ctl = { version = "0.6", optional = true, features = ["stats"] }
